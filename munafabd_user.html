// ── FIX 3: Hardware Back Button Prevention ──
// Push initial state so back button doesn't exit
history.pushState({ page: 'app' }, '', location.href);
window.addEventListener('popstate', function(e) {
  // Re-push state to prevent exit
  history.pushState({ page: 'app' }, '', location.href);
  // If popup is open, close it instead
  const popup = document.getElementById('popupContainer');
  if (popup && popup.innerHTML.trim() !== '') {
    closePopup();
    return;
  }
  // Otherwise go to home
  if (window._currentUID) {

  }
});

onAuthStateChanged(auth, async (fireUser) => {
  if (fireUser) {
    window._currentUID = fireUser.uid;
    const [snap, ppSnap, siteSnap] = await Promise.all([
      get(ref(db, `users/${fireUser.uid}`)),
      get(ref(db, 'settings/welcomePopup')),
      get(ref(db,'settings/site'))
    ]);
    if (!snap.exists()) { await signOut(auth); return; }
    const u = snap.val();
    if (u.role === 'admin') { await signOut(auth); toast('এটি অ্যাডমিন অ্যাকাউন্ট', 'err'); return; }
    if (u.status === 'disabled') { await signOut(auth); toast('আপনার অ্যাকাউন্ট নিষ্ক্রিয় করা হয়েছে', 'err'); return; }

    window._userCache = u;
    // Live listener keeps the cache fresh in the background — no more re-fetching on every page nav
    if (window._userListenerRef) off(window._userListenerRef);
    window._userListenerRef = ref(db, `users/${fireUser.uid}`);
    onValue(window._userListenerRef, (s) => { if (s.exists()) window._userCache = s.val(); });

    // Live listener keeps the unseen-notification count fresh in the background —
    // updateNotifBadge() no longer does a network round trip on every page navigation.
    if (window._notifListenerRef) off(window._notifListenerRef);
    window._notifCount = 0;
    window._notifListenerRef = ref(db, `notifications/${fireUser.uid}`);
    onValue(window._notifListenerRef, (s) => {
      let count = 0;
      if (s.exists()) s.forEach(c => { if (!c.val().seen) count++; });
      window._notifCount = count;
      updateNotifBadge();
    });

    if (ppSnap.exists()) window._welcomePopup = ppSnap.val();
    if (siteSnap.exists() && siteSnap.val().startDate) window._siteStartDate = new Date(siteSnap.val().startDate);

    // Firebase is the source of truth for language once logged in (so it follows
    // the account across devices) — falls back to the localStorage guess only
    // when the account has never picked one.
    if (u.language) { window._lang = u.language; try { localStorage.setItem('ci_lang', u.language); } catch(e) {} }
    applyLanguage();

    H('authScreen').classList.add('hidden');
    H('app').classList.remove('hidden');
    H('loading').classList.add('hidden');

    showPage('home');
    startSiteTimer();
    if (!u.language) {
      showLanguagePopup();
    } else if (window._welcomePopup.enabled && !window._popupShown) {
      window._popupShown = true;
      showWelcomePopup();
    }
  } else {
    window._currentUID = '';
    window._userCache = null;
    if (window._userListenerRef) { off(window._userListenerRef); window._userListenerRef = null; }
    if (window._notifListenerRef) { off(window._notifListenerRef); window._notifListenerRef = null; }
    window._notifCount = 0;
    window._popupShown = false;
    H('loading').classList.add('hidden');
    H('authScreen').classList.remove('hidden');
    H('app').classList.add('hidden');
    if (window._timerInterval) clearInterval(window._timerInterval);
  }
});

// ── FIX: "hover triggers click" bug ──
// Touch events keep firing on the element where the finger first touched down,
// no matter where the finger moves to before it lifts. The old code fired the
// handler on every touchend with no check, so scrolling a finger down the
// screen — starting on or passing over an icon — registered as a tap on that
// icon. This wrapper only fires the handler if the finger didn't move more
// than `threshold` px between touchstart and touchend (a real tap), and
// otherwise treats it as a scroll/drag and ignores it.
window.bindTap = function(el, handler, threshold) {
  threshold = threshold || 10;
  let startX = 0, startY = 0, moved = false;
  el.addEventListener('touchstart', function(e){
    const t = e.changedTouches[0];
    startX = t.clientX; startY = t.clientY; moved = false;
  }, {passive:true});
  el.addEventListener('touchmove', function(e){
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - startX) > threshold || Math.abs(t.clientY - startY) > threshold) moved = true;
  }, {passive:true});
  el.addEventListener('touchend', function(e){
    if (moved) return;
    e.preventDefault();
    handler(e);
  }, {passive:false});
  el.addEventListener('click', handler);
};
window.toast = (msg, type='info') => {
  let t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;z-index:99999;
    background:${type==='ok'?'rgba(15,230,168,0.92)':type==='err'?'rgba(255,77,109,0.92)':'rgba(124,58,237,0.92)'};
    color:#fff;box-shadow:0 6px 20px rgba(0,0,0,0.3);white-space:nowrap;max-width:90vw;text-align:center;`;
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
};

window.closePopup = () => {
  H('popupContainer').innerHTML = '';

async function getUser(uid) {
  // Serve from the live in-memory cache when available — avoids a network round trip on every page.
  if (!uid || uid === window._currentUID) {
    if (window._userCache) return window._userCache;
  }
  const snap = await get(ref(db, `users/${uid||window._currentUID}`));
  return snap.exists() ? snap.val() : null;
}
window.getUser = getUser;

window.genRefCode = (uid) => {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i = 0; i < 8; i++) code += chars[Math.floor(Math.random()*chars.length)];
  return 'CI-' + code;
};

// ── SITE TIMER ──
window.startSiteTimer = () => {
  if (window._timerInterval) clearInterval(window._timerInterval);
  window._timerInterval = setInterval(() => {
    const now = new Date();
    const diff = now - window._siteStartDate;
    const days = Math.floor(diff / 86400000);
    const hrs = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    const dEl = H('t_days'), hEl = H('t_hrs'), mEl = H('t_mins'), sEl = H('t_secs');
    if(dEl) dEl.textContent = String(days).padStart(2,'0');
    if(hEl) hEl.textContent = String(hrs).padStart(2,'0');
    if(mEl) mEl.textContent = String(mins).padStart(2,'0');
    if(sEl) sEl.textContent = String(secs).padStart(2,'0');
  }, 1000);
};

// ── AUTH ──
window.doRegister = async () => {
  const name = H('regName').value.trim();
  const phone = H('regPhone').value.trim();
  const email = H('regEmail').value.trim();
  const pass = H('regPass').value;
  const refCode = H('regRef').value.trim();
  if (!name||!phone||!email||!pass) { toast('সব তথ্য পূরণ করুন','err'); return; }
  if (pass.length < 6) { toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর','err'); return; }
  const btn = H('regBtn'); btn.disabled = true; btn.textContent = 'অপেক্ষা করুন...';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;
    let referredBy = '', referrerUID = '';
    const refToCheck = refCode || window._refFromUrl;
    if (refToCheck) {
      const allUsersSnap = await get(ref(db,'users'));
      if(allUsersSnap.exists()) {
        allUsersSnap.forEach(c => {
          const u = c.val();
          if(u.referralCode === refToCheck || c.key === refToCheck) {
            referredBy = refToCheck; referrerUID = c.key;
          }
        });
      }
    }
    const myRefCode = genRefCode(uid);
    await set(ref(db, `users/${uid}`), {
      uid, name, email, phone, role:'user', earningBalance:0, depositBalance:0, status:'active',
      createdAt: Date.now(), referralCode: myRefCode,
      referredBy: referredBy || '', referrerUID: referrerUID || ''
    });
    if (referrerUID) {
      // ── SECURE BALANCE UPDATE: runTransaction avoids lost-update races when
      // multiple referred users sign up for the same referrer at the same time ──
      const rTx = await runTransaction(ref(db,`users/${referrerUID}/earningBalance`), (cur) => (Number(cur)||0) + 50);
      if (rTx.committed) {
        const newRBal = Number(rTx.snapshot.val()||0);
        await push(ref(db,`balanceHistory/${referrerUID}`), {
          type:'credit', amount:50, reason:`রেফারেল বোনাস (আর্নিং) — ${name}`,
          balanceAfter: newRBal, date:'এইমাত্র', ts:Date.now()
        });
        await push(ref(db,`notifications/${referrerUID}`), {
          msg:`🎉 ${name} আপনার রেফারেল লিংক দিয়ে যোগ দিয়েছেন! ৳৫০ বোনাস পেয়েছেন।`,
          seen:false, date:'এইমাত্র', ts:Date.now()
        });
      }
    }
    await push(ref(db, `notifications/${uid}`), {
      msg:`${name}, MunafaBD-এ স্বাগতম! 🎉 আপনার রেফারেল কোড: ${myRefCode}`,
      seen:false, date:'এইমাত্র', ts:Date.now()
    });
    toast('অ্যাকাউন্ট তৈরি হয়েছে! ✅','ok');
    switchTab('login');
    H('loginEmail').value = email;
  } catch(e) {
    let msg = 'রেজিস্ট্রেশন ব্যর্থ হয়েছে';
    if (e.code === 'auth/email-already-in-use') msg = 'এই ইমেইল ইতিমধ্যে নিবন্ধিত';
    toast(msg,'err');
  }
  btn.disabled = false; btn.textContent = 'অ্যাকাউন্ট তৈরি করুন →';
};

window.doLogin = async () => {
  const email = H('loginEmail').value.trim();
  const pass = H('loginPass').value;
  if (!email||!pass) { toast('ইমেইল ও পাসওয়ার্ড দিন','err'); return; }
  const btn = H('loginBtn'); btn.disabled = true; btn.textContent = 'লগইন হচ্ছে...';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    toast('ইমেইল বা পাসওয়ার্ড ভুল','err');
    btn.disabled = false; btn.textContent = 'লগইন করুন →';
  }
};

window.doLogout = async () => {
  window._popupShown = false;
  if (window._timerInterval) clearInterval(window._timerInterval);
  await signOut(auth);
};

window.switchTab = (tab) => {
  H('loginForm').classList.toggle('hidden', tab!=='login');
  H('registerForm').classList.toggle('hidden', tab==='login');
  H('tabLogin').classList.toggle('active', tab==='login');
  H('tabRegister').classList.toggle('active', tab!=='login');
  H('authSubText').textContent = tab==='login'?tr('auth_login_sub'):tr('auth_register_sub');
  if(tab==='register' && window._refFromUrl) {
    setTimeout(()=>{ const el=H('regRef'); if(el) el.value=window._refFromUrl; },50);
  }
};

window.buyShare = async (cardId) => {
  const btn = H('bsBuyBtn_'+cardId);
  const snap = await get(ref(db, `buyShareCards/${cardId}`));
  if (!snap.exists()) { toast('অফার পাওয়া যায়নি','err'); return; }
  const bs = snap.val();
  if (!(bs.endTime > Date.now())) { toast('অফারের মেয়াদ শেষ হয়ে গেছে','err'); renderBuyShare(); return; }
  const u = await getUser();
  if (!u || Number(u.depositBalance) < Number(bs.price)) { toast('পর্যাপ্ত ডিপোজিট ব্যালেন্স নেই','err'); return; }

  if (btn) { btn.disabled = true; btn.textContent = 'প্রক্রিয়া হচ্ছে...'; }
  try {
    // ── SECURE BALANCE UPDATE: transaction re-checks the deposit balance at the
    // moment of write (not just from the stale cached read above) and aborts
    // the whole purchase if funds are insufficient, preventing a negative balance ──
    let insufficient = false;
    const price = Number(bs.price);
    const balTx = await runTransaction(ref(db, `users/${window._currentUID}/depositBalance`), (cur) => {
      const c = Number(cur)||0;
      if (c < price) { insufficient = true; return; } // abort, no write happens
      return c - price;
    });
    if (insufficient || !balTx.committed) { toast('পর্যাপ্ত ডিপোজিট ব্যালেন্স নেই','err'); if (btn) { btn.disabled = false; btn.textContent = `🛒 কিনুন — ৳${fmt(bs.price)}`; } return; }
    const newBal = Number(balTx.snapshot.val()||0);
    const endTime = Date.now() + Number(bs.durationDays) * 86400000;
    await push(ref(db, `myShares/${window._currentUID}`), {
      title: bs.title, imageUrl: bs.imageUrl, price: bs.price, durationDays: bs.durationDays,
      description: bs.description || '', profitAmount: bs.profitAmount || 0,
      purchasedAt: Date.now(), endTime
    });
    await push(ref(db, `balanceHistory/${window._currentUID}`), {
      type:'debit', amount:bs.price, reason:'শেয়ার ক্রয় (ডিপোজিট ব্যালেন্স)', balanceAfter:newBal, date:'এইমাত্র', ts:Date.now()
    });
    await push(ref(db, `notifications/${window._currentUID}`), {
      msg:`🛒 আপনি ৳${fmt(bs.price)} দিয়ে "${bs.title}" শেয়ার কিনেছেন!`, seen:false, date:'এইমাত্র', ts:Date.now()
    });
    toast('শেয়ার কেনা সফল হয়েছে ✅','ok');
    renderBuyShare();
  } catch (e) {
    toast('সমস্যা হয়েছে','err');
    if (btn) { btn.disabled = false; btn.textContent = `🛒 কিনুন — ৳${fmt(bs.price)}`; }
  }
};

window.startBuyShareOfferCountdowns = () => {
  if (window._bsInterval) clearInterval(window._bsInterval);
  const tick = () => {
    const els = document.querySelectorAll('.bs-offer-timer');
    if (!els.length) { clearInterval(window._bsInterval); return; }
    els.forEach(el => {
      const endTime = Number(el.getAttribute('data-endtime'));
      const diff = endTime - Date.now();
      if (diff <= 0) { el.textContent = 'শেষ'; return; }
      const d = Math.floor(diff/86400000);
      const h = Math.floor((diff%86400000)/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      el.textContent = `${d}দ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    });
  };
  tick();
  window._bsInterval = setInterval(tick, 1000);
};

window.startMyShareCountdowns = () => {
  if (window._myShareInterval) clearInterval(window._myShareInterval);
  const tick = () => {
    const els = document.querySelectorAll('.myshare-timer');
    if (!els.length) { clearInterval(window._myShareInterval); return; }
    els.forEach(el => {
      const endTime = Number(el.getAttribute('data-endtime'));
      const diff = endTime - Date.now();
      if (diff <= 0) { el.textContent = '✅ COMPLETED'; return; }
      const d = Math.floor(diff/86400000);
      const h = Math.floor((diff%86400000)/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      el.textContent = `${d}দ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    });
    document.querySelectorAll('.myshare-status').forEach(el => {
      const endTime = Number(el.getAttribute('data-endtime'));
      if (endTime - Date.now() <= 0) el.textContent = '✅ COMPLETED';
    });
  };
  tick();
  window._myShareInterval = setInterval(tick, 1000);
};

window.submitTransfer = async () => {
  const amt = Number(H('trfAmt').value||0);
  if (amt < 10) { toast('ন্যূনতম ১০ টাকা দিন','err'); return; }
  const btn = H('trfBtn'); btn.disabled = true; btn.textContent = 'প্রক্রিয়া হচ্ছে...';
  try {
    // ── SECURE BALANCE UPDATE ──
    // earningBalance and depositBalance are moved in ONE transaction on the
    // user node itself, so the deduction and the credit either both happen or
    // neither does (no state where money leaves earning but never reaches
    // deposit), and the funds check is re-verified at write time, not just
    // from a stale cached read — this closes the double-submit / race window
    // that a plain get() + update() has.
    let insufficient = false;
    const txRes = await runTransaction(ref(db, `users/${window._currentUID}`), (cur) => {
      if (!cur) return cur; // user node missing — abort, nothing to do
      const eb = Number(cur.earningBalance)||0;
      if (eb < amt) { insufficient = true; return; } // abort transaction, no write
      cur.earningBalance = eb - amt;
      cur.depositBalance = (Number(cur.depositBalance)||0) + amt;
      return cur;
    });
    if (insufficient || !txRes.committed) {
      toast('পর্যাপ্ত আর্নিং ব্যালেন্স নেই','err');
      btn.disabled = false; btn.textContent = '🔁 ট্রান্সফার করুন';
      return;
    }
    const after = txRes.snapshot.val() || {};
    const newEarning = Number(after.earningBalance)||0;
    const newDeposit = Number(after.depositBalance)||0;
    await push(ref(db, `balanceHistory/${window._currentUID}`), {
      type:'debit', amount:amt, reason:'আর্নিং থেকে ডিপোজিটে ট্রান্সফার', balanceAfter:newEarning, date:'এইমাত্র', ts:Date.now()
    });
    await push(ref(db, `balanceHistory/${window._currentUID}`), {
      type:'credit', amount:amt, reason:'আর্নিং থেকে ট্রান্সফার প্রাপ্ত', balanceAfter:newDeposit, date:'এইমাত্র', ts:Date.now()
    });
    toast('ট্রান্সফার সফল হয়েছে ✅','ok');
    showPage('wallet');
  } catch(e) { toast('সমস্যা হয়েছে','err'); }
  btn.disabled = false; btn.textContent = '🔁 ট্রান্সফার করুন';
};

// ══ LOAN ══
// Recomputes late fee / remaining amount for an active (approved) loan based on
// elapsed time past dueTs and current settings, and persists the change so the
// admin panel and this page always agree. Read-only for non-active loans.
window.refreshLoanRecord = async (loan) => {
  if (loan.status !== 'approved') { loan._isOverdue = false; return loan; }
  const now = Date.now();
  const dueTs = Number(loan.dueTs||0);
  const daysOverdue = now > dueTs ? Math.floor((now-dueTs)/86400000) : 0;
  const ctx = window._loanCtx || {};
  const lateFeePct = Number(ctx.lateFeePercentPerDay||0);
  const waived = !!loan.lateFeeWaived;
  const newLateFee = (!waived && daysOverdue>0) ? Math.round(daysOverdue * lateFeePct/100 * Number(loan.totalRepayment||0)) : 0;
  const totalDue = Number(loan.totalRepayment||0) + newLateFee;
  const paid = Number(loan.paidAmount||0);
  const newRemaining = Math.max(0, totalDue - paid);
  const updates = {};
  if (newLateFee !== Number(loan.lateFee||0)) updates.lateFee = newLateFee;
  if (newRemaining !== Number(loan.remainingAmount||0)) updates.remainingAmount = newRemaining;
  if (Object.keys(updates).length) {
    try { await update(ref(db, `loanRequests/${loan.key}`), updates); } catch(e) {}
    Object.assign(loan, updates);
  }
  loan._isOverdue = daysOverdue > 0 && newRemaining > 0;
  loan._daysOverdue = daysOverdue;
  return loan;
};

window.loanDisplayStatus = (l) => {
  if (l.status === 'approved' && l._isOverdue) return 'overdue';
  if (l.status === 'repaid') return 'paid'; // backward compat with older records
  return l.status;
};

  const [settingsSnap, reqSnap, myShareSnap] = await Promise.all([
    get(ref(db, 'settings/loan')),
    get(ref(db, `loanRequests`)),
    get(ref(db, `myShares/${window._currentUID}`))
  ]);

  const u = await getUser();
  const loanSettings = settingsSnap.exists() ? settingsSnap.val() : null;
  const chargePct = Number(loanSettings && loanSettings.serviceChargePercent || 0);
  const durationDays = Number(loanSettings && loanSettings.durationDays || 0);
  const lateFeePercentPerDay = Number(loanSettings && loanSettings.lateFeePercentPerDay || 0);
  const autoApprovalEnabled = !!(loanSettings && loanSettings.autoApprovalEnabled);
  const minAccountAgeDays = Number(loanSettings && loanSettings.minAccountAgeDays || 0);
  const eligibility = (loanSettings && loanSettings.eligibility) || {};

  // ── LOAN LIMIT SYSTEM (single system: Starting Amount → grows on each full repayment) ──
  // Every user's own loan limit begins at startingAmount (admin-set; stored lazily on
  // users/$uid/loanCurrentLimit on first use) and increases by limitIncreasePerRepayment
  // each time one of their loans reaches 'paid' status, capped at maxLimit. If the admin
  // hasn't configured a Starting Amount yet, no loan limit exists and the loan option
  // stays locked/hidden until they do.
  const startingAmount = Number(loanSettings && loanSettings.startingAmount || 0);
  const limitIncreasePerRepayment = Number(loanSettings && loanSettings.limitIncreasePerRepayment || 0);
  const maxLimit = Number(loanSettings && loanSettings.maxLimit || 0);
  const progressiveEnabled = startingAmount > 0;
  const repaidCount = Number(u.loanRepaidCount || 0);

  let userLoanLimit = 0;
  if (progressiveEnabled) {
    userLoanLimit = (u.loanCurrentLimit != null) ? Number(u.loanCurrentLimit) : startingAmount;
    if (maxLimit > 0 && userLoanLimit > maxLimit) userLoanLimit = maxLimit;
  }
  let nextLoanLimit = userLoanLimit;
  if (progressiveEnabled) {
    nextLoanLimit = userLoanLimit + limitIncreasePerRepayment;
    if (maxLimit > 0 && nextLoanLimit > maxLimit) nextLoanLimit = maxLimit;
  }
  const atMaxLimit = progressiveEnabled && maxLimit > 0 && userLoanLimit >= maxLimit;

  // ── LOAN ELIGIBILITY PROGRESS ──
  // Deposit total / real-referral count / withdraw count are counters maintained
  // by the admin panel at approval time (users/$uid fields — cheap, owner-readable).

  let myShareCount = 0;
  if (myShareSnap.exists()) myShareSnap.forEach(() => { myShareCount++; });
  const myDeposit = Number(u.totalApprovedDeposit || 0);

  myLoans.sort((a,b)=>(b.ts||0)-(a.ts||0));

  window._loanCtx = {
    chargePct, durationDays, lateFeePercentPerDay, autoApprovalEnabled, minAccountAgeDays, eligibility, myShareCount,
    startingAmount, limitIncreasePerRepayment, maxLimit, progressiveEnabled, userLoanLimit, nextLoanLimit, repaidCount
  };

  // Refresh late-fee/remaining on any active loans before rendering
  for (const l of myLoans) { if (l.status === 'approved') await refreshLoanRecord(l); }

  const activeLoan = myLoans.find(l => l.status === 'approved');

window.updateLoanCalc = () => {
  const ctx = window._loanCtx || {};
  const amtEl = H('loanAmt');
  const amt = Number(amtEl ? amtEl.value : 0) || 0;
  const service = Math.round(amt * (ctx.chargePct||0) / 100);
  const total = amt + service;
  const due = new Date(Date.now() + (ctx.durationDays||0) * 86400000);
  const dueStr = due.toLocaleDateString(window._lang==='en' ? 'en-GB' : 'bn-BD', { year:'numeric', month:'short', day:'numeric' });
  const sOut = H('loanServiceOut'), tOut = H('loanTotalOut'), dOut = H('loanDueOut');
  if (sOut) sOut.textContent = '৳ ' + fmt(service);
  if (tOut) tOut.textContent = '৳ ' + fmt(total);
  if (dOut) dOut.textContent = amt > 0 ? dueStr : '—';
};

// Loan eligibility for auto-approval: account age, active status, and no
// currently-overdue prior loan. Manual admin review is always the fallback
// when auto-approval is off or the user doesn't qualify.
window.submitLoanApplication = async () => {
  const ctx = window._loanCtx || {};
  if (ctx.eligibilityOk === false) { toast(tr('loan_elig_locked_msg'), 'err'); return; }
  const amt = Number((H('loanAmt')||{}).value || 0);
  if (!amt || amt <= 0) { toast(tr('loan_enter_amount'), 'err'); return; }
  if (amt > ctx.availableLimit) { toast(tr('loan_exceeds'), 'err'); return; }
  const service = Math.round(amt * (ctx.chargePct||0) / 100);
  const total = amt + service;
  const dueTs = Date.now() + (ctx.durationDays||0) * 86400000;
  const dueStr = new Date(dueTs).toLocaleDateString(window._lang==='en' ? 'en-GB' : 'bn-BD', { year:'numeric', month:'short', day:'numeric' });

  const btn = H('loanApplyBtn'); if (btn) { btn.disabled = true; btn.textContent = tr('loan_processing'); }
  try {
    const u = await getUser();
    const accountAgeDays = (Date.now() - Number(u.createdAt||0)) / 86400000;
    const ageOk = accountAgeDays >= Number(ctx.minAccountAgeDays||0);
    const activityOk = u.status === 'active';

    // Previous repayment history — disqualify auto-approval if any past loan is currently overdue
    let hasOverdueHistory = false;
    const allLoansSnap = await get(ref(db, 'loanRequests'));
    if (allLoansSnap.exists()) {
      const now = Date.now();
      allLoansSnap.forEach(c => {
        const v = c.val();
        if (v.uid === window._currentUID && v.status === 'approved') {
          const due = Number(v.dueTs||0);
          const rem = v.remainingAmount != null ? Number(v.remainingAmount) : Number(v.totalRepayment||0);
          if (now > due && rem > 0) hasOverdueHistory = true;
        }
      });
    }
    // Extra eligibility requirements admin can toggle on/off (deposit total, real
    // referral count, share-buy count, withdraw count). A disabled requirement is
    // always treated as satisfied — only ON requirements gate auto-approval.
    const elig = ctx.eligibility || {};
    const depositOk = !elig.depositEnabled || Number(u.totalApprovedDeposit||0) >= Number(elig.minDeposit||0);
    const referralOk = !elig.referralEnabled || Number(u.realReferralCount||0) >= Number(elig.minReferral||0);
    const shareOk = !elig.shareEnabled || Number(ctx.myShareCount||0) >= Number(elig.minShare||0);
    const withdrawOk = !elig.withdrawEnabled || Number(u.totalApprovedWithdraws||0) >= Number(elig.minWithdraw||0);

    const eligible = ageOk && activityOk && !hasOverdueHistory && depositOk && referralOk && shareOk && withdrawOk;
    const autoApprove = !!ctx.autoApprovalEnabled && eligible;

    const loanData = {
      uid: window._currentUID, amount: amt, serviceChargePercent: ctx.chargePct||0,
      serviceCharge: service, totalRepayment: total, durationDays: ctx.durationDays||0,
      dueDate: dueStr, dueTs, ts: Date.now(), date: 'এইমাত্র',
      paidAmount: 0, remainingAmount: total, lateFee: 0, lateFeeWaived: false,
      autoApproved: autoApprove,
      status: autoApprove ? 'approved' : 'pending'
    };
    if (autoApprove) loanData.approvedAt = Date.now();

    await push(ref(db, 'loanRequests'), loanData);

    if (autoApprove) {
      const txRes = await runTransaction(ref(db, `users/${window._currentUID}/earningBalance`), (cur) => (Number(cur)||0) + amt);
      const newBal = Number(txRes.snapshot.val()||0);
      await push(ref(db, `balanceHistory/${window._currentUID}`), { type:'credit', amount:amt, reason:'লোন স্বয়ংক্রিয় অনুমোদিত', balanceAfter:newBal, date:'এইমাত্র', ts:Date.now() });
      await push(ref(db, `notifications/${window._currentUID}`), { msg:`🎉 আপনার ৳${fmt(amt)} লোন স্বয়ংক্রিয়ভাবে অনুমোদিত হয়েছে এবং ওয়ালেটে যোগ হয়েছে!`, seen:false, date:'এইমাত্র', ts:Date.now() });
      toast(tr('loan_auto_approved_msg'), 'ok');
    } else {
      await push(ref(db, `notifications/${window._currentUID}`), { msg:`🏦 আপনার ৳${fmt(amt)} লোন রিকোয়েস্ট পাঠানো হয়েছে। অনুমোদনের অপেক্ষায়।`, seen:false, date:'এইমাত্র', ts:Date.now() });
      toast(tr('loan_applied_ok'), 'ok');
    }
    renderLoanPage();
  } catch (e) {
    toast('সমস্যা হয়েছে', 'err');
    if (btn) { btn.disabled = false; btn.textContent = tr('loan_apply_btn'); }
  }
};

window.payLoanConfirm = async (key) => {
  const amt = Number((H('payAmt')||{}).value || 0);
  if (!amt || amt <= 0) { toast(tr('loan_enter_amount'), 'err'); return; }
  const btn = H('payConfirmBtn'); if (btn) { btn.disabled = true; btn.textContent = tr('loan_processing'); }
  try {
    const [loanSnap, u] = await Promise.all([ get(ref(db, `loanRequests/${key}`)), getUser() ]);
    if (!loanSnap.exists()) { toast('লোন পাওয়া যায়নি', 'err'); if (btn) { btn.disabled=false; btn.textContent=tr('loan_confirm_payment'); } return; }
    const loan = loanSnap.val();
    const totalDue = Number(loan.totalRepayment||0) + Number(loan.lateFee||0);
    const remaining = loan.remainingAmount != null ? Number(loan.remainingAmount) : Math.max(0, totalDue - Number(loan.paidAmount||0));
    if (amt > remaining + 0.01) { toast(tr('loan_pay_exceeds_remaining'), 'err'); if (btn) { btn.disabled=false; btn.textContent=tr('loan_confirm_payment'); } return; }
    if (Number(u.earningBalance||0) < amt) { toast(tr('loan_insufficient_balance'), 'err'); if (btn) { btn.disabled=false; btn.textContent=tr('loan_confirm_payment'); } return; }

    // ── SECURE BALANCE UPDATE ── deduct wallet inside a transaction so the
    // sufficient-funds check is re-verified against the live value.
    let insufficient = false;
    const txRes = await runTransaction(ref(db, `users/${window._currentUID}/earningBalance`), (cur) => {
      const c = Number(cur)||0;
      if (c < amt) { insufficient = true; return; }
      return c - amt;
    });
    if (insufficient || !txRes.committed) { toast(tr('loan_insufficient_balance'), 'err'); if (btn) { btn.disabled=false; btn.textContent=tr('loan_confirm_payment'); } return; }
    const newBal = Number(txRes.snapshot.val()||0);

    const newPaid = Number(loan.paidAmount||0) + amt;
    const newRemaining = Math.max(0, totalDue - newPaid);
    const newStatus = newRemaining <= 0 ? 'paid' : 'approved';
    const updates = { paidAmount:newPaid, remainingAmount:newRemaining, status:newStatus };
    if (newStatus === 'paid') updates.paidAt = Date.now();
    await update(ref(db, `loanRequests/${key}`), updates);
    await push(ref(db, `loanRequests/${key}/payments`), { amount:amt, ts:Date.now(), date:'এইমাত্র' });

    // ── LOAN LIMIT UPGRADE ON FULL REPAYMENT ──
    // Fires exactly once, the moment a loan flips to 'paid'. Always tracks the
    // repayment count; only grows the actual limit when the admin has turned on
    // the progressive system (startingAmount > 0), capped at maxLimit.
    if (newStatus === 'paid') {
      const ctx = window._loanCtx || {};
      try { await runTransaction(ref(db, `users/${window._currentUID}/loanRepaidCount`), (cur) => (Number(cur)||0) + 1); } catch(e) {}
      if (Number(ctx.startingAmount||0) > 0) {
        const inc = Number(ctx.limitIncreasePerRepayment||0);
        const cap = Number(ctx.maxLimit||0);
        const startAmt = Number(ctx.startingAmount||0);
        try {
          await runTransaction(ref(db, `users/${window._currentUID}/loanCurrentLimit`), (cur) => {
            const base = (cur != null) ? Number(cur) : startAmt;
            let next = base + inc;
            if (cap > 0 && next > cap) next = cap;
            return next;
          });
        } catch(e) {}
      }
    }
    await push(ref(db, `balanceHistory/${window._currentUID}`), { type:'debit', amount:amt, reason:'লোন পরিশোধ', balanceAfter:newBal, date:'এইমাত্র', ts:Date.now() });
    await push(ref(db, `notifications/${window._currentUID}`), {
      msg: newStatus==='paid' ? `✅ আপনার লোন সম্পূর্ণ পরিশোধ হয়েছে! 🎉` : `💰 আপনি ৳${fmt(amt)} লোন পরিশোধ করেছেন। বাকি: ৳${fmt(newRemaining)}`,
      seen:false, date:'এইমাত্র', ts:Date.now()
    });
    toast(tr('loan_payment_success'), 'ok');
    renderLoanPage();
  } catch (e) {
    toast('সমস্যা হয়েছে', 'err');
    if (btn) { btn.disabled = false; btn.textContent = tr('loan_confirm_payment'); }
  }
};

<!-- MOBILE & ONCLICK FIX -->
<script>
(function(){
  function waitAndBind(){
    if(typeof window.showPage!=='function'){ setTimeout(waitAndBind,80); return; }
    // Bottom nav
    document.querySelectorAll('.nav-item').forEach(function(el){
      var fn=el.getAttribute('onclick'); if(!fn) return;
      el.removeAttribute('onclick');
      function h(e){ if(e.cancelable) e.preventDefault(); try{eval(fn);}catch(err){} }
      window.bindTap(el, h);
    });
    // Auth buttons
    ['loginBtn','regBtn','tabLogin','tabRegister'].forEach(function(id){
      var el=document.getElementById(id); if(!el) return;
      var fn=el.getAttribute('onclick'); if(!fn) return;
      el.removeAttribute('onclick');
      function h(e){ if(e.cancelable) e.preventDefault(); try{eval(fn);}catch(err){} }
      window.bindTap(el, h);
    });
    // Delegate data-action (document-level — tracks its own touchstart position
    // so a scroll that starts on or passes over a data-action element isn't
    // mistaken for a tap on it)
    document.addEventListener('click',function(e){
      var el=e.target.closest('[data-action]'); if(!el) return;
      handleAction(el);
    });
    var _daStartX=0,_daStartY=0,_daMoved=false;
    document.addEventListener('touchstart',function(e){
      var t=e.changedTouches[0]; _daStartX=t.clientX; _daStartY=t.clientY; _daMoved=false;
    },{passive:true});
    document.addEventListener('touchmove',function(e){
      var t=e.changedTouches[0];
      if(Math.abs(t.clientX-_daStartX)>10 || Math.abs(t.clientY-_daStartY)>10) _daMoved=true;
    },{passive:true});
    document.addEventListener('touchend',function(e){
      var el=e.target.closest('[data-action]'); if(!el) return;
      if(_daMoved) return;
      e.preventDefault();
      handleAction(el);
    },{passive:false});
  }
  function handleAction(el){
    var a=el.getAttribute('data-action'), arg=el.getAttribute('data-arg')||'';
    if(a==='showPage'&&window.showPage) window.showPage(arg);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',waitAndBind);
  else waitAndBind();
})();
</script>
